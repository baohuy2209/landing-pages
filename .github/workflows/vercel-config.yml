name: Validate Vercel build filters

on:
  pull_request:
    paths:
      - 'landing-pages/**/vercel.json'
      - 'www/vercel.json'
      - '.github/scripts/check-vercel-config.mjs'
      - '.github/workflows/vercel-config.yml'
  push:
    paths:
      - 'landing-pages/**/vercel.json'
      - 'www/vercel.json'
      - '.github/scripts/check-vercel-config.mjs'
      - '.github/workflows/vercel-config.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/check-vercel-config.mjs
